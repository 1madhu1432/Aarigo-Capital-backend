<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CC72E" />
      <stop offset="100%" stop-color="#5A9E1A" />
    </linearGradient>
  </defs>

  <!-- White square base (matches Aarigo logo background) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#ffffff" />

  <!-- Green rounded border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#6DA728" stroke-width="3" />

  <!-- Bold "A" letterform in Aarigo green -->
  <!-- Left diagonal leg -->
  <path d="M14 50 L32 14 L50 50" stroke="#6DA728" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Crossbar of the A -->
  <line x1="21" y1="37" x2="43" y2="37" stroke="#6DA728" stroke-width="6" stroke-linecap="round" />

  <!-- Swoosh flowing lines across the A (Aarigo signature mark) -->
  <path d="M20 43 Q30 38 44 40" stroke="#6DA728" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.55" />
  <path d="M22 47 Q32 42 46 44" stroke="#6DA728" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4" />
</svg>
